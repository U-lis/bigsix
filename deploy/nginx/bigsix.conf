# bigsix 정적 배포용 vhost.
#
# 서브도메인 루트로 서빙한다. PWA 의 start_url 과 아이콘 경로가 절대경로(/)라
# 하위 경로에 두면 scope 가 어긋난다.
#
# 설치:
#   sudo cp bigsix.conf /etc/nginx/sites-available/bigsix.conf
#   sudo ln -sf /etc/nginx/sites-available/bigsix.conf /etc/nginx/sites-enabled/bigsix.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 주의: 이 파일을 heredoc 으로 ssh -t 에 흘려보내지 말 것. TTY 라인 디시플린이
# 문자를 먹어 파일이 조각난다. 2026-09-04 에 실제로 겪었다. scp 로 올린다.

server {
    listen 80;
    listen [::]:80;
    server_name bigsix.siot-ieung.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    # nginx 1.24 는 `http2 on;` 을 모른다 (1.25.1+). listen 에 붙이는 구문법을 쓴다.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bigsix.siot-ieung.duckdns.org;

    ssl_certificate     /etc/nginx/ssl/bigsix/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/bigsix/key.pem;

    root /var/www/bigsix;
    index index.html;

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # 파일명에 해시가 박혀 있다. 내용이 바뀌면 이름이 바뀌므로 영구 캐시해도 안전하다.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 서비스워커는 절대 캐시하지 않는다. 여기가 캐시되면 새 배포를 영영 못 잡는다.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    # HTML 은 매번 재검증한다. 프리캐시 매니페스트가 여기 들어 있다.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
